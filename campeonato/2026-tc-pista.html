function proyectar(fecha,orden,pole,series,oficial){
 const ult=fecha>=D.total,car={};
 const add=(n,k,v)=>{(car[n]=car[n]||{c:0,s:0,f:0})[k]+=v};
 if(pole)add(pole,'c',D.ESC.pole*(ult?D.rec:1));
 series.forEach(s=>s.forEach((n,i)=>{if(i<10)add(n,'s',ptsSerie(i+1,ult))}));
 orden.forEach((n,i)=>add(n,'f',orden.length>=D.min?ptsFinal(i+1,ult):0));
 const todos=new Set([...D.P.map(p=>p.n),...Object.keys(car)]);
 const prim=D.reg+1;
 const base=[...todos].map(n=>{const p=P.get(n),o={nro:n,prev:0,p1:0,p2:0,p3:0,fprev:0,v:0,vent:0,fp:{}};
  if(p)for(const k in p.f){const f=+k,[c,s,fi]=p.f[k],pp=c+s+fi;o.fp[f]=pp;if(f>=fecha)continue;o.prev+=pp;o.fprev+=fi;
   if(f>=prim)o.vent+=pp;const nr=fi/(f===D.total?D.rec:1);if(nr>=40){o.p1++;o.v++}else if(nr===37)o.p2++;else if(nr===34)o.p3++}
  const c=car[n]||{c:0,s:0,f:0};o.c=c.c;o.s=c.s;o.f=c.f;o.pf=c.c+c.s+c.f;return o});
 const ordena=(a,b)=>b.total-a.total||b.p1-a.p1||b.p2-a.p2||b.p3-a.p3||b.f-a.f;
 const prev=base.map(o=>({nro:o.nro,total:o.prev,p1:o.p1,p2:o.p2,p3:o.p3,f:o.fprev})).sort(ordena);
 const pp=new Map(prev.map((o,i)=>[o.nro,i+1]));
 const G=base.map(o=>{const w=orden[0]===o.nro;return {...o,piloto:nm(o.nro),total:o.prev+o.pf,v:o.v+(w?1:0),
  p1:o.p1+(orden[0]===o.nro?1:0),p2:o.p2+(orden[1]===o.nro?1:0),p3:o.p3+(orden[2]===o.nro?1:0),posPrev:pp.get(o.nro)}})
  .filter(o=>o.prev>0||o.pf>0||D.C.some(c=>c.n===o.nro));
 // Copa
 let cop=null,campeon=null;
 if(fecha>D.reg){
  const cl=D.C.filter(c=>c.e==='clasificado').map(c=>{const o=G.find(x=>x.nro===c.n)||{nro:c.n,vent:0,pf:0,total:0,v:0,piloto:nm(c.n)};
   return {nro:c.n,piloto:nm(c.n),estado:'Clasificado',arr:c.a,vent:o.vent,pf:o.pf,copa:c.a+o.vent+o.pf,total:o.total,v:o.v}});
  const ids=new Set(cl.map(c=>c.nro));
  const pool=G.filter(o=>!ids.has(o.nro)).sort(ordena).slice(0,D.um)
   .map(o=>({nro:o.nro,piloto:o.piloto,estado:'Último minuto',arr:0,vent:o.vent,pf:o.pf,copa:o.vent+o.pf,total:o.total,v:o.v}));
  cop=[...cl,...pool].sort((a,b)=>b.copa-a.copa);cop.forEach((c,i)=>{c.pos=i+1;c.puede=c.v>=1});
  if(ult&&!oficial){campeon=cop.find(c=>c.puede)||null;if(campeon){const o=G.find(x=>x.nro===campeon.nro);if(o)o.total+=D.bonus}}}
 G.sort(ordena);G.forEach((o,i)=>{o.pos=i+1;o.cambio=o.posPrev?o.posPrev-o.pos:0});
 return {G,cop,campeon,ult,largan:orden.length};
}

function vGeneral(){
 const R=proyectar(PROX,[],'',[],1);const fs=D.fechas.map(f=>f.n);const lid=R.G[0]?R.G[0].total:0;
 const cols=[['Pos'],['Nº'],['Piloto',1],['Vic.'],...D.fechas.map(f=>[f.n+'<br><small class="dim">'+esc(f.t.split(' ').slice(0,1)[0])+'</small>']),['Total'],['Dif.'],['']];
 const filas=R.G.map(o=>row(o.nro,[o.pos,sn(o.nro),esc(o.piloto),o.v||'',...fs.map(f=>o.fp[f]!=null?g1(o.fp[f]):'<span class="dim">·</span>'),'<b>'+g1(o.total)+'</b>',o.pos===1?'':'−'+g1(lid-o.total),star(o.nro)],[2]));
 return '<section><h2>Campeonato general · tras la fecha '+Math.max(...fs)+' ('+esc(D.fechas[D.fechas.length-1].t)+')</h2><p class="note">Puntos por fecha (clasificación + series + final) tomados de actc.org.ar. Desempate: art. 48 (más primeros puestos en finales, luego segundos, terceros…). ★ para seguir pilotos (queda guardado).</p>'+
  '<div class="bar nop"><button onclick="window.print()">⬇ Exportar PDF</button></div>'+buscador()+tabla(cols,filas,'')+'</section>'}

function vCopa(){
 const R=proyectar(PROX,[],'',[],1);if(!R.cop)return '<section><p class="note">La Copa empieza en la fecha '+(D.reg+1)+'.</p></section>';
 const fs=D.fechas.map(f=>f.n).filter(f=>f>D.reg);
 const cols=[['Pos'],['Nº'],['Piloto',1],['Estado',1],['Arranque'],...fs.map(f=>['F'+f]),['Copa'],['Dif. con el puntero'],['Campeonato'],['']];
 const filas=R.cop.map(c=>{const o=R.G.find(x=>x.nro===c.nro)||{fp:{}};return row(c.nro,[c.pos,sn(c.nro),esc(c.piloto),c.estado,c.arr?g1(c.arr):'—',...fs.map(f=>o.fp&&o.fp[f]!=null?g1(o.fp[f]):'·'),'<b>'+g1(c.copa)+'</b>',c.pos===1?'—':'−'+g1(R.cop[0].copa-c.copa),g1(c.total),star(c.nro)],[2,3])});
 const F=D.FMT[D.cat];
 return '<section><h2>'+esc(D.copaNombre)+' · tras la fecha '+Math.max(...D.fechas.map(f=>f.n))+'</h2><p class="note">'+F.puesto+(F.exc?' + '+F.exc+' por excepción':'')+' clasificados por puesto al cierre de la fecha '+F.reg+' ('+F.arr+' pts al puntero del campeonato y +'+F.bonus+' por victoria de la etapa regular) y '+F.um+' de «último minuto» (los mejores de la general que no clasificaron, sin bonus). Última fecha +50% y +'+F.ganador+' al ganador de la Copa; el campeón debe haber ganado al menos una final en la temporada.</p>'+
  '<div class="bar nop"><button onclick="window.print()">⬇ Exportar PDF</button></div>'+buscador()+tabla(cols,filas,'')+'</section>'}

function vPuntaje(){
 const E=D.ESC,f=x=>g1(x),f15=x=>g1(x*D.rec),fil=[];
 for(let i=1;i<=10;i++)fil.push('<tr><td>'+i+'º</td><td>'+(i===1?f(E.pole):'—')+'</td><td>'+f(E.serie[i-1])+'</td><td>'+f(E.final[i-1])+'</td><td class="dim">'+(i===1?f15(E.pole):'—')+' / '+f15(E.serie[i-1])+' / '+f15(E.final[i-1])+'</td></tr>');
 for(let i=11;i<=30;i++)fil.push('<tr><td>'+i+'º</td><td>—</td><td>—</td><td>'+f(E.final[i-1])+'</td><td class="dim">— / — / '+f15(E.final[i-1])+'</td></tr>');
 fil.push('<tr><td>31º al 40º</td><td>—</td><td>—</td><td>'+f(E.f3140)+'</td><td class="dim">— / — / '+f15(E.f3140)+'</td></tr>');
 fil.push('<tr><td>41º al último</td><td>—</td><td>—</td><td>'+f(E.f41)+'</td><td class="dim">— / — / '+f15(E.f41)+'</td></tr>');
 const t1=tabla([['Puesto'],['Clasificación'],['Serie'],['Final'],['Última fecha (+50%)<br><small>clasif. / serie / final</small>']],fil,'pts');
 const F=D.FMT,fc=(k,fn)=>'<tr><td>'+k+'</td><td>'+fn(F.TC)+'</td><td>'+fn(F.TCP)+'</td></tr>';
 const t2=tabla([['Copa'],['TC · '+esc(F.TC.nombre)],['TCP · '+esc(F.TCP.nombre)]],[
  fc('Fechas de etapa regular',x=>x.reg),fc('Fechas de la Copa',x=>x.copa+' (fechas '+(x.reg+1)+' a '+(x.reg+x.copa)+')'),
  fc('Clasificados por puesto',x=>x.puesto+(x.exc?' + '+x.exc+' por excepción':'')),fc('«Último minuto»',x=>x.um),
  fc('Puntos de arranque al puntero',x=>x.arr),fc('Bonus por victoria de la etapa regular',x=>'+'+x.bonus),
  fc('Última fecha',x=>'+50% de puntos y +'+x.ganador+' al ganador de la Copa'),fc('Fuente',x=>'<span class="dim">'+esc(x.fuente)+'</span>')],'pts');
 const t3=tabla([['Artículo'],['Tema',1],['Regla',1]],D.ART.map(a=>'<tr><td>'+esc(a[0])+'</td><td class="l">'+esc(a[1])+'</td><td class="l">'+esc(a[2])+'</td></tr>'),'');
 return '<section><h2>Puntos por instancia del fin de semana · TC y TC Pista</h2><p class="note">Escala idéntica en TC y TCP (art. 5). Clasificación: 2 pts al mejor tiempo. Series: top 10. Final: todos los puestos. Mínimo '+D.min+' autos en la final para otorgar puntaje. '+
  '<b>Ojo:</b> el Reglamento Deportivo 2026 no está en la carpeta (el PDF con ese nombre es el Técnico); se usa el 2025 contrastado con los puntos reales 2026 de actc.org.ar.</p>'+t1+'</section>'+
  '<section><h2>Copa de Oro (TC) y Copa de Plata (TCP) · formato 2026</h2>'+t2+'</section><section><h2>Artículos que afectan el puntaje</h2>'+t3+'</section>'}

// ------------------------------------------------------------- puntos ganados por fecha
const INST=[['Total'],['Clasificación'],['Series'],['Final']];
function setInst(i){S.inst=+i;draw()}
function setOrd(v){S.ord=+v;draw()}
function vFechas(){
 const R=proyectar(PROX,[],'',[],1),fs=D.fechas.map(f=>f.n);
 const val=(o,f)=>{const a=(P.get(o.nro)||{f:{}}).f[f];return a?(S.inst===0?a[0]+a[1]+a[2]:a[S.inst-1]):null};
 let G=[...R.G];if(S.ord)G.sort((a,b)=>(val(b,S.ord)??-1)-(val(a,S.ord)??-1));
 const mx={},lid={};fs.forEach(f=>{let m=-1;R.G.forEach(o=>{const v=val(o,f);if(v!=null&&v>m){m=v;lid[f]=[o]}else if(v!=null&&v===m)lid[f].push(o)});mx[f]=m});
 const tot=o=>fs.reduce((a,f)=>a+(val(o,f)||0),0);
 const celda=(o,f)=>{const v=val(o,f);if(v==null)return '<span class="dim">·</span>';const w=mx[f]>0?Math.round(v/mx[f]*55):0;
  return '<span style="display:block;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--gold) '+w+'%,transparent)'+(v===mx[f]&&v>0?';font-weight:700;outline:1.5px solid var(--gold)':'')+'">'+g1(v)+'</span>'};
 const cols=[['Pos'],['Nº'],['Piloto',1],...D.fechas.map(f=>[f.n+'<br><small class="dim">'+esc(f.t.split(' ').slice(1).join(' '))+'</small>']),['Total'],['Prom.'],['']];
 const filas=G.map((o,i)=>{const t=tot(o),n=fs.filter(f=>val(o,f)!=null).length;
  return row(o.nro,[S.ord?i+1:o.pos,sn(o.nro),esc(o.piloto),...fs.map(f=>celda(o,f)),'<b>'+g1(t)+'</b>',n?g1(t/n):'·',star(o.nro)],[2])});
 const gan=tabla([['Fecha'],['Carrera',1],['Más puntos',1],['Puntos']],fs.map(f=>'<tr><td>'+f+'</td><td class="l">'+esc(D.fechas.find(x=>x.n===f).t)+'</td><td class="l">'+(lid[f]||[]).map(o=>esc(o.piloto)+' (Nº '+sn(o.nro)+')').join(' / ')+'</td><td><b>'+g1(mx[f])+'</b></td></tr>'),'');
 return '<section><h2>Puntos ganados por fecha · '+INST[S.inst][0]+'</h2><div class="bar nop"><span class="blbl">Instancia</span><div class="seg">'+
  INST.map((x,i)=>'<button class="'+(i===S.inst?'on':'')+'" onclick="setInst('+i+')">'+x[0]+'</button>').join('')+'</div>'+
  '<label>Ordenar por <select onchange="setOrd(this.value)"><option value="0">Campeonato</option>'+fs.map(f=>'<option value="'+f+'"'+(S.ord===f?' selected':'')+'>Puntos de la fecha '+f+'</option>').join('')+'</select></label>'+
  '<button onclick="window.print()">⬇ Exportar PDF</button></div>'+buscador()+
  '<p class="note">Puntos que sumó cada piloto en cada fecha (la intensidad del color es proporcional al máximo de la fecha; recuadro = quien más puntos hizo). Los 4 filtros separan clasificación, series y final.</p>'+
  tabla(cols,filas,'')+'</section><section><h2>Quién sumó más en cada fecha · '+INST[S.inst][0]+'</h2>'+gan+'</section>'}

// ------------------------------------------------------------- en vivo
const nros=s=>[...new Set(String(s).split(/[^0-9]+/).filter(Boolean))];
function setOrden(a){S.orden=a;guardar();draw()}
function addP(n){if(!S.orden.includes(n)){S.orden.push(n);guardar();draw()}}
function quitar(i){S.orden.splice(i,1);guardar();draw()}
function mover(i,j){j=Math.max(0,Math.min(S.orden.length-1,j));if(i===j)return;const [x]=S.orden.splice(i,1);S.orden.splice(j,0,x);guardar();draw()}
function pegar(v){setOrden(nros(v))}
function setPole(v){S.pole=nros(v)[0]||'';guardar();draw()}
function setSerie(i,v){S.series[i]=nros(v).join(' ');guardar();draw()}
function masSerie(){S.series.push('');guardar();draw()}
function reiniciar(){if(confirm('¿Borrar el orden de la final, la pole y las series?')){S.orden=[];S.pole='';S.series=S.series.map(()=>'');guardar();draw()}}
function selFecha(v){S.fecha=+v;guardar();draw()}
function setTop(v){S.top=+v;draw()}
function eAgregar(e){if(e.key!=='Enter')return;const v=nros(e.target.value);let a=[...S.orden];v.forEach(n=>{if(!a.includes(n))a.push(n)});setOrden(a)}
function vVivo(){
 const R=proyectar(S.fecha,S.orden,S.pole,S.series.map(nros));
 const falta=D.P.filter(p=>/^[0-9]/.test(p.n)&&!S.orden.includes(p.n)).sort((a,b)=>a.p.localeCompare(b.p));
 const opF=[...D.fechas.map(f=>[f.n,'Fecha '+f.n+' · '+f.t+' (ya corrida)']),...(D.prox?[[D.prox.n,'Fecha '+D.prox.n+' · '+D.prox.t+' (por correr)']]:[])].sort((a,b)=>a[0]-b[0]);
 const ord=S.orden.map((n,i)=>'<div class="r"><b>'+(i+1)+'º</b><span>'+n+' · '+esc(nm(n))+' <span class="dim">'+g1(R.largan>=D.min?ptsFinal(i+1,R.ult):0)+' pts</span></span>'+
  '<span><input type="number" min="1" max="'+S.orden.length+'" value="'+(i+1)+'" onchange="mover('+i+',this.value-1)" title="Mover a esta posición"><button onclick="mover('+i+','+(i-1)+')">▲</button><button onclick="mover('+i+','+(i+1)+')">▼</button></span><button onclick="quitar('+i+')">✕</button></div>').join('');
 const aviso=S.orden.length&&S.orden.length<D.min?'<p class="note" style="color:#ef6b6b">Con menos de '+D.min+' autos en la final no se otorgan puntos de la final (art. 4).</p>':'';
 const top=S.top;const gf=R.G.filter((o,i)=>i<top||S.seg.has(o.nro));
 const filasG=gf.map(o=>row(o.nro,[o.pos,dlt(o.cambio),sn(o.nro),esc(o.piloto),g1(o.prev),o.pf?'+'+g1(o.pf):'<span class="dim">·</span>','<b>'+g1(o.total)+'</b>',o.pos===1?'':'−'+g1(R.G[0].total-o.total),star(o.nro)],[3]));
 let copaH='<p class="note">La Copa empieza en la fecha '+(D.reg+1)+'.</p>';
 if(R.cop)copaH=tabla([['Pos'],['Nº'],['Piloto',1],['Estado',1],['+Fecha'],['Copa'],['Dif.'],['Camp.'],['']],R.cop.map(c=>row(c.nro,[c.pos,sn(c.nro),esc(c.piloto),c.estado+(R.ult&&!c.puede?' <span class="dim">(sin victoria)</span>':''),c.pf?'+'+g1(c.pf):'·','<b>'+g1(c.copa)+'</b>',c.pos===1?'':'−'+g1(R.cop[0].copa-c.copa),g1(c.total),star(c.nro)],[2,3])),'');
 const camp=R.campeon?'<div class="camp">🏆 <b>Campeón proyectado:</b> '+esc(nm(R.campeon.nro))+' (Nº '+R.campeon.nro+') · Copa '+g1(R.campeon.copa)+' pts · +'+D.bonus+' al campeonato</div>':(R.ult?'<div class="camp">Última fecha: sin campeón proyectado todavía (nadie elegible).</div>':'');
 return '<section>'+buscador()+'<div class="bar"><label>Fecha <select onchange="selFecha(this.value)">'+opF.map(o=>'<option value="'+o[0]+'"'+(o[0]===S.fecha?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'+
  '<label>Mostrar <select onchange="setTop(this.value)">'+[10,15,20,99].map(n=>'<option value="'+n+'"'+(n===S.top?' selected':'')+'>'+(n===99?'Todos':'Top '+n)+'</option>').join('')+'</select></label>'+
  '<button onclick="reiniciar()">Reiniciar</button><span class="hint">'+(R.ult?'Última fecha: +50% de puntos y +'+D.bonus+' al ganador de la Copa.':'Se guarda solo en este dispositivo.')+'</span></div></section>'+
  '<div class="grid2"><section><h2>Carrera en vivo</h2>'+
  '<div class="bar"><label>Pole (nº) <input style="width:60px" value="'+esc(S.pole)+'" onchange="setPole(this.value)"></label></div>'+
  '<div class="hint" style="margin-top:6px">Series (orden de llegada, solo los 10 primeros suman)</div>'+S.series.map((s,i)=>'<div class="bar" style="margin:3px 0"><label>Serie '+(i+1)+' <input style="width:260px;max-width:60vw" value="'+esc(s)+'" placeholder="nº nº nº …" onchange="setSerie('+i+',this.value)"></label></div>').join('')+'<button onclick="masSerie()">+ serie</button>'+
  '<h3 style="margin:12px 0 4px">Orden de la final</h3>'+
  '<div class="bar"><input id="add" placeholder="Agregar nº (Enter)" style="width:150px" onkeydown="eAgregar(event)"><span class="hint">o tocá un piloto abajo</span></div>'+
  '<div class="pl">'+falta.map(p=>'<button data-n="'+p.n+'" onclick="addP(this.dataset.n)">'+p.n+' '+esc(nom(p.p).split(',')[0])+'</button>').join('')+'</div>'+
  '<textarea placeholder="Pegá el orden completo: 1 256 101 11 …" onchange="pegar(this.value)">'+S.orden.join(' ')+'</textarea>'+aviso+
  '<div class="ord">'+(ord||'<p class="hint">Todavía no cargaste el orden. Agregá los pilotos del 1º al último; podés cambiar posiciones con ▲▼ o escribiendo la posición nueva.</p>')+'</div></section>'+
  '<section><h2>Campeonato proyectado</h2>'+camp+tabla([['Pos'],[''],['Nº'],['Piloto',1],['Previo'],['+Fecha'],['Total'],['Dif.'],['']],filasG,'')+
  '<h2 style="margin-top:16px">'+esc(D.copaNombre)+' proyectada</h2>'+copaH+'</section></div>'}

// ------------------------------------------------------------- pestañas
const TABS=[['Campeonato general',vGeneral],['Copa de '+(D.cat==='TC'?'Oro':'Plata'),vCopa],['Puntos por fecha',vFechas],['Puntaje por instancia',vPuntaje],['🔴 En vivo',vVivo]];
function draw(){
 $('tabs').innerHTML=TABS.map((t,i)=>'<button class="'+(i===S.tab?'on':'')+'" onclick="S.tab='+i+';draw()">'+t[0]+'</button>').join('');
 const y=window.scrollY;$('panel').innerHTML=TABS[S.tab][1]();window.scrollTo(0,y);if(EMB)avisar()}
function avisar(){try{parent.postMessage({camH:document.documentElement.scrollHeight},'*')}catch(e){}}
if(EMB&&window.ResizeObserver)new ResizeObserver(avisar).observe(document.body);
draw();
</script></body></html>
