  if(CAMPS.includes(ck))$('analisis').innerHTML+=` <a class="pill" style="font-size:15px;padding:8px 16px;font-weight:700" href="campeonato/${ck}.html">🏆 Campeonato ${st.cat} ${st.anio} · general, Copa, puntaje, en vivo →</a>`;
}
function ir(a,c){st={anio:a,cat:c};location.hash=a+'/'+encodeURIComponent(c);render()}
function abrirTodo(v){document.querySelectorAll('details.pista').forEach(d=>d.open=v)}
window.addEventListener('hashchange',()=>{st=hashEstado();render()});
render();
</script></body></html>
